[project]
name = "mehnatledger-backend"
version = "0.1.0"
description = "MehnatLedger backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.1",
    "pyjwt[crypto]>=2.15.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
]

# The backend is an application, not an installable library. This keeps
# `uv sync` limited to installing dependencies.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
